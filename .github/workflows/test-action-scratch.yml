name: Test Action Scratch

on:
  workflow_dispatch:

jobs:
  file-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write sample CSV
        run: |
          cat > sample.csv <<'EOF'
          Resource_ID,Monthly_Cost_USD,CPU_Util,Unattached_Storage_Cost,Is_Public,Is_Encrypted,State,Tags
          vol-0123456789abcdef0,15.50,0.0,15.50,False,False,available,
          i-0987654321fedcba0,120.00,2.1,0.0,True,True,running,
          vol-1111222233334444,45.00,85.4,0.0,False,True,available,
          EOF
      - name: Run action in file mode
        id: audit
        uses: Ace-FinOps-Enterprise/aws-finops-auditor-action@v1
        with:
          file: sample.csv
      - name: Show outputs
        run: |
          echo "monthly-waste=${{ steps.audit.outputs.monthly-waste }}"
          echo "annual-waste=${{ steps.audit.outputs.annual-waste }}"
    live-wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run action with no inputs (live mode)
        uses: Ace-FinOps-Enterprise/aws-finops-auditor-action@v1
